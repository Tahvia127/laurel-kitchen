name: Build site

on:
  push:
    branches: [main]
    paths: ['data/**', 'build.mjs', 'assets/img/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Render pages from data
        run: node build.mjs

      - name: Commit rebuilt pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- '*.html'; then
            echo "No page changes."
          else
            git add index.html menu.html order.html events.html
            git commit -m "Rebuild pages from content"
            git push
          fi
