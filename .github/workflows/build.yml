name: Build site

on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'build.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Render pages from data
        run: node build.mjs

      - name: Commit rebuilt pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html menu.html; then
            echo "No page changes."
          else
            git add index.html menu.html
            git commit -m "Rebuild pages from menu data"
            git push
          fi
